# Production stack for the VPS. Values come from .env (see .env.example).
#   docker compose up -d --build                      — build and start everything
#   docker compose run --rm migrate npx prisma db seed — fill an empty database with demo content
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sneakora
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: sneakora
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sneakora -d sneakora"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Applies database migrations, then exits. The app starts only after it succeeds.
  migrate:
    build:
      context: .
      target: migrate
    environment:
      DATABASE_URL: postgresql://sneakora:${POSTGRES_PASSWORD}@db:5432/sneakora
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: .
      target: runner
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://sneakora:${POSTGRES_PASSWORD}@db:5432/sneakora
      UPLOAD_DIR: /app/uploads
    volumes:
      - uploads:/app/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully

  # HTTPS (automatic Let's Encrypt certificates) and fast delivery of uploaded files.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - uploads:/srv/uploads:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  pgdata:
  uploads:
  caddy_data:
  caddy_config:
